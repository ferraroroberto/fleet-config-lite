# .fleet.toml — this repo's architecture-map card.
# Lite fork: the GitHub Copilot CLI hooks, skills and installer behind app-launcher-lite's Board.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🧰"
display_name = "Fleet Config Lite"
description  = "Lite fork of fleet-config: Copilot CLI session hooks, issue-workflow skills and installer."
shape        = "skills-governance"
extra_roots  = ["hook-config"]

[vendored]
static_ratchet = { src = "scripts/static_ratchet.py", sha = "0eb0da42298e391fc614b3fe550bd6cf2d07c693", dest = "scripts/static_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "713b1d1e36989440679ec4e415ff149b14d96c81", dest = "scripts/structure_layout.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/conventions_ratchet.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "baac1ed97388a3545bd1e52544821ec20f1dc77a", dest = "scripts/comment_ratchet.py" }
classify_e2e = { src = "scripts/classify_e2e.py", sha = "5d460bd1d9d44eed955c5357d1c9f622f2550ad8", dest = "skills/e2e/classify_e2e.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The unit
# run (python -m unittest discover -s tests) includes tests/test_static_ratchet.py,
# which runs scripts/static_ratchet_gate.py, which wraps scripts/static_ratchet.py:
# it fails on a duplicate block (jscpd via npx, Python and JS) or an unused
# import/variable (ruff F401,F841) or a curated ruff bug/security finding (B and S
# codes, S113 included) that is not in .static-ratchet-baseline.json.
# Needs Node and ruff on the interpreter that runs the tests; a detector that cannot
# run exits 3, which fails the run as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The unit
# run (python -m unittest discover -s tests) includes tests/test_structure_ratchet.py,
# which runs scripts/structure_ratchet.py: it fails when a new file passes 1,000
# lines, a new function 100 lines or a flat directory 40 modules, when a baselined
# offender grows past its size in .structure-ratchet-baseline.json, and when the root
# folders do not match `shape` plus `extra_roots`. Existing offenders are baselined at
# today's size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown
# shape) fails the run as NOT CONFIRMED. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet lint over instruction
# files. The unit run (python -m unittest discover -s tests) includes
# tests/test_instruction_ratchet.py, which runs scripts/instruction_ratchet.py: it fails
# when a SKILL.md (or a doc one links) gains a hit on a deterministic prompt-audit rule,
# or passes a size cap, beyond .instruction-ratchet-baseline.json. This repo keeps its
# skills under skills/ and has no CLAUDE.md or AGENTS.md. Existing hits are baselined at
# today's count, never excluded. Exit 3 (git unusable, an unreadable file, an unclosed
# fence, an unreadable skill description) fails the run as NOT CONFIRMED. Procedure:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled    = true
baseline   = ".instruction-ratchet-baseline.json"
skill_dirs = ["skills"]

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet lint over documentation
# references. The unit run (python -m unittest discover -s tests) includes
# tests/test_doc_refs_ratchet.py, which runs scripts/doc_refs_ratchet.py: it fails when
# README.md or docs/**/*.md names a repo path, `python -m` module or relative link that
# does not exist, beyond .doc-refs-ratchet-baseline.json. This repo declares no `port`,
# so ports are not checked, and it has no CLAUDE.md. Existing dangling references are
# baselined, never excluded; `allow_refs` lists the one intentional pointer, the
# shared-helper folder docs/layout.md says the first shared helper creates. Exit 3 (git
# unusable, a file that is not UTF-8, an unclosed fence) fails the run as NOT CONFIRMED.
# Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = ["skills/_lib"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet lint for definitions nothing
# references. The unit run (python -m unittest discover -s tests) includes
# tests/test_dead_code_ratchet.py, which runs scripts/dead_code_ratchet.py: it fails when
# a tracked Python file gains a function, class or method whose name appears nowhere else
# in the tree, beyond .dead-code-ratchet-baseline.json. Every vendored file is declared
# in [vendored] so its unused API is not reported as this repo's. Hooks and skill
# scripts are plain functions called by name, so no `allow` or `entry_decorators` is
# needed. Exit 3 (git unusable, a .py file that cannot be read or parsed) fails the run
# as NOT CONFIRMED. Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet conventions
# one AST rule can check. The unit run (python -m unittest discover -s tests) includes
# tests/test_conventions_ratchet.py, which runs scripts/conventions_ratchet.py: it fails
# when a file's count for an enabled rule rises above its entry in
# .conventions-ratchet-baseline.json. Enabled: no-window (hooks and skills spawn on
# Windows), logging-not-print (hooks/ and skills/ hold the library code) and
# no-drive-path (nothing here may name a machine's drive). secret-compare and git-wrapper
# stay off because the repo has no secret-compare or git helper. There is no [e2e]
# router table, so the baseline file needs no tier rule. Existing hits are baselined,
# never excluded. Exit 3 (git unusable, a .py file that does not parse) fails the run
# as NOT CONFIRMED. Procedure: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled     = true
baseline    = ".conventions-ratchet-baseline.json"
rules       = ["no-window", "logging-not-print", "no-drive-path"]
print_paths = ["hooks/", "skills/"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet lint for the README and docs
# convention. The unit run (python -m unittest discover -s tests) includes
# tests/test_docs_ratchet.py, which runs scripts/docs_ratchet.py: it fails when the root
# README.md passes `readme_max_bytes` or a README.md / docs/**/*.md file gains a history
# marker (an issue reference, a dated heading or a changelog heading) beyond its entry in
# .docs-ratchet-baseline.json. Existing markers are baselined, never excluded. Exit 3
# (git unusable, a file that is not UTF-8, an unclosed fence or HTML comment) fails the
# run as NOT CONFIRMED. Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet lint for history in code
# comments. The unit run (python -m unittest discover -s tests) includes
# tests/test_comment_ratchet.py, which runs scripts/comment_ratchet.py: it fails when a
# .py, .js, .css or .ps1 file gains a `#NNN` issue reference inside a comment beyond its
# entry in .comment-ratchet-baseline.json. A comment states why the code is the way it is
# now; how it got there lives in the issue, the PR and git log. Every vendored
# destination is left out automatically. Existing references are baselined, never
# excluded. Exit 3 (git unusable, a file that cannot be scanned) fails the run as
# NOT CONFIRMED. Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
