# .fleet.toml — this repo's architecture-map card.
# Lite fork: the skills and global instructions that sit beside app-launcher-lite's Copilot side.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🧰"
display_name = "Fleet Config Lite"
description  = "Lite fleet-config: audit, learning-log, prompt-audit and slides skills plus the global instructions."
shape        = "skills-governance"

[vendored]
port_host_ratchet = { src = "scripts/port_host_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/port_host_ratchet.py" }
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }
personal_data_ratchet = { src = "scripts/personal_data_ratchet.py", sha = "f911e1c5adc679fee1522e748d9f4fc4c140561d", dest = "scripts/personal_data_ratchet.py" }
clean_tree_ratchet = { src = "scripts/clean_tree_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/clean_tree_ratchet.py" }
static_ratchet = { src = "scripts/static_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/static_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/structure_ratchet.py" }
structure_layout = { src = "scripts/structure_layout.py", sha = "f911e1c5adc679fee1522e748d9f4fc4c140561d", dest = "scripts/structure_layout.py" }
structure_band = { src = "scripts/structure_band.py", sha = "3b708fd3c54ab7b93b08d489406c405762c83c41", dest = "scripts/structure_band.py" }
instruction_ratchet = { src = "scripts/instruction_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/instruction_ratchet.py" }
doc_refs_ratchet = { src = "scripts/doc_refs_ratchet.py", sha = "f911e1c5adc679fee1522e748d9f4fc4c140561d", dest = "scripts/doc_refs_ratchet.py" }
dead_code_ratchet = { src = "scripts/dead_code_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/dead_code_ratchet.py" }
conventions_ratchet = { src = "scripts/conventions_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/conventions_ratchet.py" }
runtime_write_ratchet = { src = "scripts/runtime_write_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/runtime_write_ratchet.py" }
runtime_write_resolve = { src = "scripts/runtime_write_resolve.py", sha = "ce64203b017ba636c82737ee7f768c9ef6f422cd", dest = "scripts/runtime_write_resolve.py" }
docs_ratchet = { src = "scripts/docs_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/docs_ratchet.py" }
comment_ratchet = { src = "scripts/comment_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/comment_ratchet.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The unit
# run (python -m unittest discover -s tests) includes tests/test_static_ratchet.py,
# which runs scripts/static_ratchet_gate.py, which wraps scripts/static_ratchet.py:
# it fails on a duplicate block (jscpd via npx, Python and JS) or an unused
# import/variable (ruff F401,F841) or a curated ruff bug/security finding (B and S
# codes, S113 included) that is not in .ratchets/static.json.
# Needs Node and ruff on the interpreter that runs the tests; a detector that cannot
# run exits 3, which fails the run as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
conventions_readers = { src = "scripts/conventions_readers.py", sha = "9f5d6b727d457616ce80e18db9f5a048ab53c3be", dest = "scripts/conventions_readers.py" }
conventions_state = { src = "scripts/conventions_state.py", sha = "4d0b0ff30e23eb95c73c4b0b1517ec6a43d3a836", dest = "scripts/conventions_state.py" }
instruction_frontmatter = { src = "scripts/instruction_frontmatter.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/instruction_frontmatter.py" }
instruction_repeats = { src = "scripts/instruction_repeats.py", sha = "fe8cc1bdbd038ed65947186248df13072eceb25a", dest = "scripts/instruction_repeats.py" }
request_budget_ratchet = { src = "scripts/request_budget_ratchet.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/request_budget_ratchet.py" }
request_budget_scan = { src = "scripts/request_budget_scan.py", sha = "5ba99b0a04b1b5d7b3689f8f7a59bd3fe625a9bc", dest = "scripts/request_budget_scan.py" }

[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The unit
# run (python -m unittest discover -s tests) includes tests/test_structure_ratchet.py,
# which runs scripts/structure_ratchet.py: it fails when a new file passes 1,000
# lines, a new function 100 lines or a flat directory 40 modules, when a baselined
# offender grows past its size in .ratchets/structure.json, and when the root
# folders do not match `shape` plus `extra_roots`. Existing offenders are baselined at
# today's size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown
# shape) fails the run as NOT CONFIRMED. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet lint over instruction
# files. The unit run (python -m unittest discover -s tests) includes
# tests/test_instruction_ratchet.py, which runs scripts/instruction_ratchet.py: it fails
# when a SKILL.md (or a doc one links) gains a hit on a deterministic prompt-audit rule,
# or passes a size cap, beyond .ratchets/instruction.json. This repo keeps its
# skills under skills/ and has no CLAUDE.md or AGENTS.md. Existing hits are baselined at
# today's count, never excluded. Exit 3 (git unusable, an unreadable file, an unclosed
# fence, an unreadable skill description) fails the run as NOT CONFIRMED. Procedure:
# project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled    = true
baseline   = ".ratchets/instruction.json"
skill_dirs = ["skills"]
# `agents_pointer` stays off: it requires an AGENTS.md pointing at a CLAUDE.md, and this repo
# has neither (the Copilot instructions are global-instructions.md).
ci_expectations     = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet lint over documentation
# references. The unit run (python -m unittest discover -s tests) includes
# tests/test_doc_refs_ratchet.py, which runs scripts/doc_refs_ratchet.py: it fails when
# README.md or docs/**/*.md names a repo path, `python -m` module or relative link that
# does not exist, beyond .ratchets/doc-refs.json. This repo declares no `port`,
# so ports are not checked, and it has no CLAUDE.md. Existing dangling references are
# baselined, never excluded. Exit 3 (git
# unusable, a file that is not UTF-8, an unclosed fence) fails the run as NOT CONFIRMED.
# Procedure: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
trees    = true
baseline   = ".ratchets/doc-refs.json"
# Paths that live elsewhere on purpose: the instructions file a sibling repo carries.
allow_refs = [".github/copilot-instructions.md"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet lint for definitions nothing
# references. The unit run (python -m unittest discover -s tests) includes
# tests/test_dead_code_ratchet.py, which runs scripts/dead_code_ratchet.py: it fails when
# a tracked Python file gains a function, class or method whose name appears nowhere else
# in the tree, beyond .ratchets/dead-code.json. Every vendored file is declared
# in [vendored] so its unused API is not reported as this repo's. Skill
# scripts are plain functions called by name, so no `allow` or `entry_decorators` is
# needed. Exit 3 (git unusable, a .py file that cannot be read or parsed) fails the run
# as NOT CONFIRMED. Procedure: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".ratchets/dead-code.json"
allow    = []

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet stage for fleet conventions
# one AST rule can check. The unit run (python -m unittest discover -s tests) includes
# tests/test_conventions_ratchet.py, which runs scripts/conventions_ratchet.py: it fails
# when a file's count for an enabled rule rises above its entry in
# .ratchets/conventions.json. Enabled: no-window (skills spawn on
# Windows), logging-not-print (skills/ holds the library code) and
# no-drive-path (nothing here may name a machine's drive), subprocess-timeout (every
# subprocess.run/call/check_* passes timeout=), host-identity (a test never reads the real
# account name or home folder; it points HOME/USERPROFILE at a temp folder) and git-wrapper (every `git` spawn goes
# through skills/_lib/git_run.py). secret-compare stays off because the repo has no
# secret-compare helper. There is no [e2e]
# router table, so the baseline file needs no tier rule. Existing hits are baselined,
# never excluded. Exit 3 (git unusable, a .py file that does not parse) fails the run
# as NOT CONFIRMED. Procedure: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled     = true
baseline    = ".ratchets/conventions.json"
rules       = ["no-window", "logging-not-print", "no-drive-path", "subprocess-timeout", "browser-per-iteration", "host-identity", "state-literal", "state-set-repeat", "state-write", "git-wrapper", "path-sep"]
git_wrappers = ["skills/_lib/git_run.py"]
print_paths = ["skills/"]

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .ratchets/runtime-write.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"

# [docs_ratchet] -- the scaffold's baseline-and-ratchet lint for the README and docs
# convention. The unit run (python -m unittest discover -s tests) includes
# tests/test_docs_ratchet.py, which runs scripts/docs_ratchet.py: it fails when the root
# README.md passes `readme_max_bytes` or a README.md / docs/**/*.md file gains a history
# marker (an issue reference, a dated heading or a changelog heading) beyond its entry in
# .ratchets/docs.json. Existing markers are baselined, never excluded. Exit 3
# (git unusable, a file that is not UTF-8, an unclosed fence or HTML comment) fails the
# run as NOT CONFIRMED. Procedure: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet lint for history in code
# comments. The unit run (python -m unittest discover -s tests) includes
# tests/test_comment_ratchet.py, which runs scripts/comment_ratchet.py: it fails when a
# .py, .js, .css or .ps1 file gains a `#NNN` issue reference inside a comment beyond its
# entry in .ratchets/comment.json. A comment states why the code is the way it is
# now; how it got there lives in the issue, the PR and git log. Every vendored
# destination is left out automatically. Existing references are baselined, never
# excluded. Exit 3 (git unusable, a file that cannot be scanned) fails the run as
# NOT CONFIRMED. Procedure: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".ratchets/comment.json"
docstrings      = true
history_phrases = true

# [request_budget_ratchet] -- the scaffold's baseline-and-ratchet stage for polling and
# background-loop waste. The unit run (python -m unittest discover -s tests) includes
# tests/test_request_budget_ratchet.py, which runs scripts/request_budget_ratchet.py: it
# fails when a file's count for a rule rises above .ratchets/request-budget.json.
# This repo serves no HTTP and ships no browser code under the default browser_paths, so
# fixed-rate-poll, poll-floor, scan-per-request and timing-middleware have nothing to read:
# scan-per-request prints OFF (no handler_dirs) and the poll helper and timing middleware
# are not vendored. unwatched-loop and default-pool read the skills Python.
# Existing hits are baselined, never excluded. Exit 3 (git unusable, a file that cannot be
# read or parsed) fails the run as NOT CONFIRMED. Procedure: project-scaffolding
# docs/request-budget-ratchet.md.
[request_budget_ratchet]
enabled      = true
baseline     = ".ratchets/request-budget.json"
server_paths = ["skills/**", "scripts/**"]

# [port_host_ratchet] -- the scaffold's baseline-and-ratchet lint for ports and
# machine-local hosts written in tracked code. The unit run (python -m unittest discover
# -s tests) includes tests/test_port_host_ratchet.py, which runs
# scripts/port_host_ratchet.py: it fails when a file gains a port or private-network host
# literal beyond .ratchets/port-host.json. This repo serves nothing and reads no port, so
# it declares no `resolvers` and the baseline is empty; a file that does come to own port
# defaults is listed under `resolvers`. Exit 3 (git unusable, a file that cannot be read or
# parsed) fails the run as NOT CONFIRMED. Procedure: project-scaffolding
# docs/port-host-ratchet.md.
[port_host_ratchet]
enabled = true

# [clean_tree_ratchet] -- the scaffold's baseline-and-ratchet stage for "an install
# leaves git status clean". The unit run includes tests/test_clean_tree_ratchet.py, which
# runs scripts/clean_tree_ratchet.py: it records git status, runs the smoke once and fails
# when the smoke added, changed or deleted a path beyond .ratchets/clean-tree.json. This
# repo serves nothing, so the smoke is a command: install.ps1 with the user profile and
# COPILOT_HOME both pointed at the run's scratch folder, so it links the instructions and
# skills there and never touches the real Copilot home; the profile is moved too because
# the installer reads ~/.agents/skills to detect a shared machine. Exit 3 (git unusable,
# the smoke could not run or exited non-zero) fails the run as NOT CONFIRMED. Procedure:
# project-scaffolding docs/clean-tree-ratchet.md.
[clean_tree_ratchet]
enabled      = true
smoke        = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "$env:USERPROFILE = $env:COPILOT_HOME; & ./install.ps1 -SkipVenv -SkipChecklist; exit $LASTEXITCODE"]
data_dir_env = "COPILOT_HOME"
timeout_s    = 120
