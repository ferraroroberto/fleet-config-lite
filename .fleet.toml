# .fleet.toml — this repo's architecture-map card.
# Lite fork: the GitHub Copilot CLI hooks, skills and installer behind app-launcher-lite's Board.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🧰"
display_name = "Fleet Config Lite"
description  = "Lite fork of fleet-config: Copilot CLI session hooks, issue-workflow skills and installer."
shape        = "skills-governance"
extra_roots  = ["hook-config"]

[vendored]
static_ratchet = { src = "scripts/static_ratchet.py", sha = "f0e6f5449ecf64c9b188ed394c2a9fd8ff678406", dest = "scripts/static_ratchet.py" }
structure_ratchet = { src = "scripts/structure_ratchet.py", sha = "0d41425ff2797c98d1d3eb7ecb7de0cdb7133456", dest = "scripts/structure_ratchet.py" }

# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The unit
# run (python -m unittest discover -s tests) includes tests/test_static_ratchet.py,
# which runs scripts/static_ratchet_gate.py, which wraps scripts/static_ratchet.py:
# it fails on a duplicate block (jscpd via npx, Python and JS) or an unused
# import/variable (ruff F401,F841) that is not in .static-ratchet-baseline.json.
# Needs Node and ruff on the interpreter that runs the tests; a detector that cannot
# run exits 3, which fails the run as NOT CONFIRMED. Procedure + limits:
# project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The unit
# run (python -m unittest discover -s tests) includes tests/test_structure_ratchet.py,
# which runs scripts/structure_ratchet.py: it fails when a new file passes 1,000
# lines, a new function 100 lines or a flat directory 40 modules, when a baselined
# offender grows past its size in .structure-ratchet-baseline.json, and when the root
# folders do not match `shape` plus `extra_roots`. Existing offenders are baselined at
# today's size, never excluded. Exit 3 (git unusable, an unparseable file, an unknown
# shape) fails the run as NOT CONFIRMED. Procedure: project-scaffolding
# docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
