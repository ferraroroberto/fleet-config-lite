<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deck name · Slide title</title>
<!-- ==slides:bootstrap== -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem("<deck-key>.theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") {
      t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<!-- ==/slides:bootstrap== -->
<style>
/* ==slides:tokens== */
:root {
  /* SINGLE source of brand color — replace per client in private context */
  --brand: #1F7A54;       /* placeholder: deep green */
  --brand-dark: #0B2E21;  /* placeholder: deep green-black */

  /* light bases */
  --bg: color-mix(in srgb, var(--brand) 8%, #ffffff);
  --slide: #ffffff;
  --ink: var(--brand-dark);
  --accent: var(--brand);
  --deep: var(--brand-dark);
  --on-accent: #ffffff;

  /* derived, theme-agnostic — recompute automatically per theme */
  --muted: color-mix(in srgb, var(--ink) 68%, var(--slide));
  --faint: color-mix(in srgb, var(--ink) 50%, var(--slide));
  --soft:  color-mix(in srgb, var(--accent) 12%, var(--slide));
  --line:  color-mix(in srgb, var(--accent) 25%, var(--slide));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: color-mix(in srgb, var(--brand-dark) 30%, #000000);
    --slide: color-mix(in srgb, var(--brand-dark) 55%, #000000);
    --ink: color-mix(in srgb, var(--brand) 12%, #ffffff);
    --accent: oklch(from var(--brand) calc(l + 0.16) c h);
    --deep: oklch(from var(--brand) calc(l + 0.30) c h);
    --on-accent: var(--bg);
  }
}
:root[data-theme="dark"] {
  --bg: color-mix(in srgb, var(--brand-dark) 30%, #000000);
  --slide: color-mix(in srgb, var(--brand-dark) 55%, #000000);
  --ink: color-mix(in srgb, var(--brand) 12%, #ffffff);
  --accent: oklch(from var(--brand) calc(l + 0.16) c h);
  --deep: oklch(from var(--brand) calc(l + 0.30) c h);
  --on-accent: var(--bg);
}
:root[data-theme="light"] {
  --bg: color-mix(in srgb, var(--brand) 8%, #ffffff);
  --slide: #ffffff;
  --ink: var(--brand-dark);
  --accent: var(--brand);
  --deep: var(--brand-dark);
  --on-accent: #ffffff;
}
/* ==/slides:tokens== */

/* ==slides:base== */
body {
  background: var(--bg); min-height: 100vh; margin: 0; overflow: hidden;
  display: grid; place-items: center; padding: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
}
.slide {
  width: min(100vw, calc(100vh * 16 / 9));
  aspect-ratio: 16 / 9;
  container-type: inline-size;
  background: var(--slide); color: var(--ink);
  display: flex; flex-direction: column;
  padding: 3.2cqw 3.6cqw 2.4cqw; box-sizing: border-box; overflow: hidden;
}
svg { stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.theme-toggle {
  position: fixed; top: 1rem; right: 1rem; width: 40px; height: 40px;
  border-radius: 50%; background: var(--slide); border: 1px solid var(--line);
  color: var(--ink); display: grid; place-items: center; cursor: pointer;
  padding: 0; z-index: 10;
}
.theme-toggle svg { width: 20px; height: 20px; }
.theme-toggle .sun { display: none; }
:root[data-theme="dark"] .theme-toggle .sun { display: block; }
:root[data-theme="dark"] .theme-toggle .moon { display: none; }
.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media print { .theme-toggle { display: none; } }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 1.2cqw; }
.eyebrow {
  font-size: 1.5cqw; font-weight: 600; text-transform: uppercase;
  letter-spacing: .16em; color: var(--accent);
}
h1 {
  font-size: 3.1cqw; font-weight: 700; letter-spacing: -.015em;
  line-height: 1.1; color: var(--ink); margin: .6cqw 0 0;
}
h1 .hl { color: var(--accent); }
.thesis { font-size: 2cqw; color: var(--muted); margin: .9cqw 0 0; }

.footer {
  margin-top: auto; display: flex; align-items: center; gap: .8cqw;
  font-size: 1.6cqw; color: var(--muted); font-variant-numeric: tabular-nums;
}
.footer svg { width: 1.8cqw; height: 1.8cqw; flex: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
/* ==/slides:base== */

/* Per-slide layout CSS goes below this line; it is NOT propagated. */
</style>
</head>
<body>
<!-- ==slides:toggle== -->
<button class="theme-toggle" type="button" aria-label="Toggle color theme">
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
</button>
<!-- ==/slides:toggle== -->

<div class="slide">
  <div class="top">
    <div class="eyebrow">Eyebrow label</div>
  </div>
  <h1>Title with exactly one <span class="hl">accent phrase</span></h1>
  <p class="thesis">One thesis line in muted ink, stating the slide's single idea.</p>

  <!-- Slide content: compose from assets/components.md, sized in cqw. -->

  <div class="footer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    <span>One muted sentence, icon plus text, identical format on every slide.</span>
  </div>
</div>

<!-- ==slides:toggle-script== -->
<script>
  (function () {
    var btn = document.querySelector(".theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("<deck-key>.theme", next); } catch (e) {}
    });
  })();
</script>
<!-- ==/slides:toggle-script== -->

<!-- deck-nav -->
<script>
  (function () {
    var slides = []; /* fill with the deck's ordered slide filenames */
    var here = location.pathname.split("/").pop().toLowerCase();
    var i = slides.indexOf(here);
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" || e.key === "Home") { location.href = "s00-nav.html"; return; }
      var isSpace = e.key === " ";
      if (isSpace && document.activeElement && document.activeElement.tagName === "BUTTON") return;
      var d = 0;
      if (e.key === "ArrowRight" || e.key === "PageDown" || isSpace) d = 1;
      else if (e.key === "ArrowLeft" || e.key === "PageUp") d = -1;
      else return;
      e.preventDefault();
      if (i === -1) return;
      var j = i + d;
      if (j < 0) { location.href = "s00-nav.html"; return; }
      if (j >= slides.length) return;
      location.href = slides[j];
    });
  })();
</script>
</body>
</html>
